<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>行业板块 · 每天 14:00 更新</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1d2430; --ink2:#586273; --ink3:#9099a8;
    --line:#eaeef3; --brand:#2b4bd8; --brand-soft:#eef1fd;
    --up:#d92b2b; --up-bg:#fdecec; --down:#128a4c; --down-bg:#e7f5ed;
    --risk:#c9740a; --risk-bg:#fff4e3; --risk-line:#f0be72;
    --neutral:#4a6fa5; --neutral-bg:#eef3fa;
    --shadow:0 2px 10px rgba(29,36,48,.05);
  }
  *{box-sizing:border-box;max-width:100%}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;padding:14px 14px 40px;min-height:100vh;background:var(--bg)}
  h1,h2,h3,p{margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

  /* ---------- 顶部 ---------- */
  .top{margin-bottom:12px}
  .brand-row{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
  .logo{width:40px;height:40px;flex:0 0 40px;border-radius:12px;
    background:linear-gradient(135deg,#3a5be0,#2b4bd8);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800}
  .brand-txt{flex:1;min-width:0}
  .brand-txt h1{font-size:19px;font-weight:800;letter-spacing:.3px;line-height:1.3}
  .brand-txt p{font-size:12px;color:var(--ink3);margin-top:2px}
  .badge{flex:0 0 auto;background:var(--brand-soft);color:var(--brand);
    border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .date-row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;
    padding:0 16px 14px;font-size:12.5px;color:var(--ink2)}
  .date-row .dot{width:6px;height:6px;border-radius:50%;background:var(--up);
    display:inline-block;margin-right:5px;vertical-align:1px}
  .cd{margin-left:auto;color:var(--brand);font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- 通用小标题 ---------- */
  .sec{margin-bottom:12px}
  .sec-h{display:flex;align-items:baseline;gap:8px;padding:2px 4px 9px;flex-wrap:wrap}
  .sec-h h2{font-size:15px;font-weight:800}
  .sec-h .sub{font-size:11.5px;color:var(--ink3);margin-left:auto}
  .basis{background:var(--neutral-bg);border:1px solid #dde7f5;border-radius:11px;
    padding:10px 12px;font-size:11.8px;color:var(--ink2);line-height:1.7;
    margin-bottom:11px;word-break:break-word}

  /* ---------- 颜色图例 ---------- */
  .legend{padding:14px 14px 12px}
  .legend-t{font-size:12px;color:var(--ink3);margin-bottom:10px;font-weight:600}
  .lg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .lg{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;
    font-size:12.5px;font-weight:600;color:var(--ink2)}
  .lg i{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
  .lg.up{background:var(--up-bg);color:var(--up)} .lg.up i{background:var(--up)}
  .lg.down{background:var(--down-bg);color:var(--down)} .lg.down i{background:var(--down)}
  .lg.risk{background:var(--risk-bg);color:var(--risk)} .lg.risk i{background:var(--risk)}
  .lg.neutral{background:var(--neutral-bg);color:var(--neutral)} .lg.neutral i{background:var(--neutral)}

  /* ---------- 今日一句话 ---------- */
  .today{padding:15px 16px;background:linear-gradient(135deg,#eef1fd,#f7f9ff);border:1px solid #dbe2fb}
  .today .k{font-size:11.5px;color:var(--brand);font-weight:700;margin-bottom:6px}
  .today .v{font-size:15px;font-weight:700;line-height:1.7;color:#1f2a4d;word-break:break-word}

  /* ---------- 筛选 chip ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
  .f-chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);
    border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
  .f-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

  /* ---------- TOP5 排名卡片 ---------- */
  .rk{margin-bottom:11px;overflow:hidden}
  .rk-top{display:flex;align-items:center;gap:8px;padding:13px 14px 0;flex-wrap:wrap}
  .rk-no{font-size:12px;font-weight:800;color:#fff;background:var(--ink3);
    border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums}
  .rk-name{font-size:16px;font-weight:800;line-height:1.35;word-break:break-word}
  .rk-score{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--brand);
    background:var(--brand-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .rk-line{font-size:11.5px;color:var(--ink3);padding:5px 14px 0;line-height:1.6;word-break:break-word}

  .val-tag{font-size:11px;font-weight:800;border-radius:6px;padding:3px 9px;white-space:nowrap}
  .val-tag.risk{background:var(--risk-bg);color:var(--risk)}
  .val-tag.neutral{background:var(--neutral-bg);color:var(--neutral)}
  .val-tag.down{background:var(--down-bg);color:var(--down)}
  .rk-val{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px 0}
  .rk-val .vt{font-size:11.5px;color:var(--ink2);font-weight:600;word-break:break-word}
  .val-bar{height:6px;border-radius:4px;background:#eef1f5;margin:8px 14px 0;overflow:hidden}
  .val-bar i{display:block;height:100%;border-radius:4px;min-width:10px}
  .val-bar.risk i{background:var(--risk)}
  .val-bar.neutral i{background:var(--neutral)}
  .val-bar.down i{background:var(--down)}
  .val-cap{font-size:10.5px;color:var(--ink3);padding:4px 14px 0;line-height:1.6;word-break:break-word}

  .rk-f{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:11px 14px 0}
  .rk-cell{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fbfcfe;min-width:0}
  .rk-cell .fn{font-size:11px;color:var(--ink3);font-weight:700}
  .rk-cell .fv{font-size:14px;font-weight:800;margin-top:3px;line-height:1.45;
    font-variant-numeric:tabular-nums;word-break:break-word}
  .rk-cell .fnote{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.6;word-break:break-word}
  .rk-cell.t-up .fv{color:var(--up)}
  .rk-cell.t-down .fv{color:var(--down)}
  .rk-cell.t-neutral .fv{color:var(--neutral)}

  .rk-chart{border:1px solid var(--line);border-radius:11px;padding:8px 8px 4px;
    background:#fbfcfe;margin:11px 14px 0}
  .rk-chart svg{display:block;width:100%;height:auto}
  .rk-legend{display:flex;gap:11px;flex-wrap:wrap;font-size:10.5px;color:var(--ink3);padding:2px 2px 4px}
  .rk-legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:3px}
  .rk-src{font-size:10.8px;color:var(--ink3);line-height:1.65;padding:9px 14px 13px;
    border-top:1px dashed var(--line);margin-top:11px;word-break:break-all}

  /* ---------- 三段式 利好 / 爆雷 卡片 ---------- */
  .sgn{margin-bottom:11px;overflow:hidden}
  .sgn-good{border-left:4px solid var(--up)}
  .sgn-bad{border-left:4px solid var(--risk)}
  .sgn-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:13px 14px 0}
  .sgn-no{font-size:11px;font-weight:800;color:#fff;background:var(--ink3);
    border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
  .sgn-theme{font-size:11.5px;font-weight:700;color:var(--brand);
    background:var(--brand-soft);border-radius:6px;padding:3px 8px}
  .sgn-time{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .sgn-imp{margin-left:auto;font-size:11px;font-weight:800;border-radius:6px;padding:3px 9px;white-space:nowrap}
  .sgn-good .sgn-imp{color:var(--up);background:var(--up-bg)}
  .sgn-bad .sgn-imp{color:var(--risk);background:var(--risk-bg)}

  .seg{margin:11px 12px 0;padding:10px 12px;border-radius:10px;background:#f7f9fc;border-left:3px solid var(--line)}
  .seg-k{display:block;font-size:11.5px;font-weight:800;margin-bottom:4px;letter-spacing:.2px}
  .seg-k i{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:currentColor;margin-right:6px;vertical-align:1px;opacity:.9}
  .seg p{font-size:13.6px;line-height:1.78;color:var(--ink);word-break:break-word}
  .s-name{background:#f3f6fd;border-left-color:#9db4ee} .s-name .seg-k{color:var(--brand)}
  .s-name p{font-size:15.5px;font-weight:800}
  .s-msg{background:#f6f8fb;border-left-color:#b9c4d4} .s-msg .seg-k{color:var(--ink2)}
  .s-opp{background:var(--down-bg);border-left-color:#8fd0ae} .s-opp .seg-k{color:var(--down)}
  .s-opp p{font-weight:600}
  .sgn-bad .s-opp{background:var(--neutral-bg);border-left-color:#b9cbe6}
  .sgn-bad .s-opp .seg-k{color:var(--neutral)}

  .risk-note{position:relative;margin:10px 12px 0;padding:10px 12px 10px 34px;
    border-radius:10px;background:var(--risk-bg);border:1px solid var(--risk-line);
    color:#8a5208;font-size:12.8px;line-height:1.7;font-weight:600;word-break:break-word}
  .risk-note::before{content:"!";position:absolute;left:11px;top:12px;
    width:16px;height:16px;border-radius:50%;background:var(--risk);color:#fff;
    font-size:11px;font-weight:800;line-height:16px;text-align:center}
  .sgn-src{font-size:10.8px;color:var(--ink3);line-height:1.65;padding:10px 14px 13px;
    border-top:1px dashed var(--line);margin-top:11px;word-break:break-all}

  /* ---------- 官方渠道 / 追溯 ---------- */
  .chan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ch{display:flex;align-items:center;gap:6px;padding:10px 9px;border-radius:11px;
    background:var(--card);border:1px solid var(--line)}
  .ch .st{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .ch.ok .st{background:var(--down)} .ch.partial .st{background:var(--risk)}
  .ch .nm{font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap}
  .ch .sm{font-size:10px;color:var(--ink3);margin-left:auto}
  .trace{margin-top:9px;padding:11px 12px;border-radius:11px;background:#fbfcfe;border:1px solid var(--line)}
  .trace .tr{display:flex;gap:8px;font-size:11px;color:var(--ink2);padding:5px 0;
    border-bottom:1px dashed var(--line);line-height:1.6}
  .trace .tr:last-child{border-bottom:0}
  .trace .tp{flex:0 0 58px;color:var(--ink3);font-weight:700}
  .trace .tn{flex:1;word-break:break-word}

  /* ---------- 页脚 ---------- */
  .disclaimer{margin-top:14px;padding:13px 14px;border-radius:12px;background:var(--risk-bg);
    border:1px solid var(--risk-line);color:#8a5208;font-size:12px;line-height:1.75;word-break:break-word}
  .foot{margin-top:12px;padding:0 4px;color:var(--ink3);font-size:11px;line-height:1.8}
  .foot b{color:var(--ink2)} .foot .ln{display:block;word-break:break-word;margin-bottom:3px}
  .empty{padding:26px 16px;text-align:center;color:var(--ink3);font-size:13px}

  @media(max-width:360px){.app{padding:10px 10px 32px}.rk-name{font-size:15px}.seg p{font-size:13px}}
  @media(min-width:520px){body{background:#e9edf3}.app{box-shadow:0 0 30px rgba(29,36,48,.08)}}
</style>
</head>
<body>
<div class="app">

  <!-- 顶部 -->
  <header class="card top">
    <div class="brand-row">
      <div class="logo">板</div>
      <div class="brand-txt">
        <h1>行业板块</h1>
        <p>每天 14:00 更新 · 综合排名版</p>
      </div>
      <div class="badge">14:00 更新</div>
    </div>
    <div class="date-row">
      <span><i class="dot"></i><span id="d-date">—</span></span>
      <span class="cd" id="d-cd">—</span>
    </div>
  </header>

  <!-- 颜色图例 -->
  <section class="card legend sec">
    <div class="legend-t">先看颜色，一眼就懂</div>
    <div class="lg-grid" id="legend"></div>
  </section>

  <!-- 今日一句话 -->
  <section class="card today sec">
    <div class="k">今日一句话</div>
    <div class="v" id="today-action">—</div>
  </section>

  <!-- 综合排名 TOP5 -->
  <section class="sec">
    <div class="sec-h"><h2>综合排名 · 前 5 板块</h2><span class="sub" id="asof">—</span></div>
    <div class="basis" id="ranking-basis">—</div>
    <div class="filters" id="filters"></div>
    <div id="top-list"></div>
  </section>

  <!-- 利好板块 -->
  <section class="sec">
    <div class="sec-h"><h2>政策与行业动向 · 利好</h2><span class="sub" id="good-count">—</span></div>
    <div id="good-list"></div>
  </section>

  <!-- 爆雷板块 -->
  <section class="sec">
    <div class="sec-h"><h2>板块爆雷 · 需留意</h2><span class="sub" id="bad-count">—</span></div>
    <div id="bad-list"></div>
  </section>

  <!-- 数据来源 -->
  <section class="sec">
    <div class="sec-h"><h2>消息来自哪</h2><span class="sub">主流财经网站</span></div>
    <div class="chan" id="channels"></div>
    <div class="trace" id="trace"></div>
  </section>

  <!-- 页脚 -->
  <div class="disclaimer" id="disclaimer">—</div>
  <div class="foot">
    <span class="ln"><b>数据来源：</b><span id="foot-source">—</span></span>
    <span class="ln"><b>更新规则：</b>每天 14:00（Asia/Shanghai）自动更新；周末与法定节假日顺延至下一交易日。由采集脚本取主流网站真实数据，生成器按排名与三段式规则刷新本页。</span>
    <span class="ln"><b>阅读提示：</b>红＝上涨/利好，绿＝下跌，橙＝风险提示/估值偏高，蓝灰＝中性/估值合理；估值偏低用绿底标注「便宜」，不代表会涨。排名是相对强弱，不等于买入建议。</span>
  </div>
</div>

  try { D = JSON.parse(document.getElementById("briefing-data").textContent || "{}"); }
  catch (e) { D = {}; }
  if (!D || !D.meta) {
    document.getElementById("top-list").innerHTML =
      '<div class="card empty">简报数据尚未生成，请先运行<br>scripts/generate_briefing.py</div>';
    return;
  }
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };
  var M = D.meta || {}, TOP = D.top5 || [], GOOD = D.good || [], BAD = D.bad || [];

  /* ---------- 顶部 ---------- */
  $("d-date").textContent = (M.date || "—") + " " + (M.weekday || "");
  $("asof").textContent = "数据 " + (M.dataTime || "—");
  $("foot-source").textContent = M.dataSource || "—";
  $("disclaimer").textContent = String(D.disclaimer || "").replace(/^[^\u4e00-\u9fa5]+/, "");
  $("ranking-basis").textContent = "排名口径：" + (M.rankingBasis || "—") +
    "。行情基准 " + (M.lastTradeDate || "—") + " 收盘，估值取近一年 PE 分位。";
  $("good-count").textContent = GOOD.length + " 个板块 · 不超过 3 个";
  $("bad-count").textContent = BAD.length + " 个板块 · 不超过 3 个";

  function tick() {
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 14, 0, 0, 0);
    if (now >= next) next.setDate(next.getDate() + 1);
    var diff = Math.max(0, Math.floor((next - now) / 1000));
    var h = Math.floor(diff / 3600), m = Math.floor((diff % 3600) / 60), s = diff % 60;
    $("d-cd").textContent = "距下次更新 " + h + " 时 " + m + " 分 " + s + " 秒";
  }
  tick(); setInterval(tick, 1000);

  /* ---------- 颜色图例 ---------- */
  $("legend").innerHTML = (D.legend || []).map(function (x) {
    return '<div class="lg ' + esc(x.color) + '"><i></i>' + esc(x.label) + "</div>";
  }).join("");
  $("today-action").textContent = M.todayAction || "";

  /* ---------- 近 30 日走势 + 成交额 SVG ---------- */
  function drawTrend(c) {
    var L = c.labels || [], C = c.close || [], A = c.amount || [];
    if (L.length < 3 || C.length !== L.length) return "";
    var W = 330, H = 122, x0 = 4, x1 = 326, y0 = 8, y1 = 80, vy0 = 92, vy1 = 114;
    var mn = Math.min.apply(null, C), mx = Math.max.apply(null, C);
    var pad = (mx - mn) * 0.1 || 1; mn -= pad; mx += pad;
    function X(i) { return x0 + (x1 - x0) * i / (L.length - 1); }
    function Y(v) { return y1 - (y1 - y0) * (v - mn) / (mx - mn); }
    var g = "";
    for (var k = 0; k <= 3; k++) {
      var yy = (y0 + (y1 - y0) * k / 3).toFixed(1);
      g += '<line x1="' + x0 + '" y1="' + yy + '" x2="' + x1 + '" y2="' + yy + '" stroke="#eef1f6" stroke-width="1"/>';
    }
    var d = "";
    for (var i = 0; i < C.length; i++) d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(C[i]).toFixed(1) + " ";
    g += '<path d="' + d.trim() + '" fill="none" stroke="#2b4bd8" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>';
    var last = C[C.length - 1], up = C.length > 1 && last >= C[C.length - 2];
    g += '<circle cx="' + X(C.length - 1).toFixed(1) + '" cy="' + Y(last).toFixed(1) +
      '" r="3.6" fill="#fff" stroke="' + (up ? "#d92b2b" : "#128a4c") + '" stroke-width="2"/>';
    var amax = Math.max.apply(null, A) || 1, bw = Math.max(2, (x1 - x0) / L.length * 0.58);
    for (var j = 0; j < A.length; j++) {
      var h = (vy1 - vy0) * (A[j] / amax);
      var cu = j === 0 || C[j] >= C[j - 1];
      g += '<rect x="' + (X(j) - bw / 2).toFixed(1) + '" y="' + (vy1 - h).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) +
        '" fill="' + (cu ? "#e8a3a3" : "#9fd3b6") + '"/>';
    }
    [0, Math.floor((L.length - 1) / 2), L.length - 1].forEach(function (ix, q) {
      var an = q === 0 ? "start" : (q === 2 ? "end" : "middle");
      g += '<text x="' + X(ix).toFixed(1) + '" y="121" text-anchor="' + an +
        '" font-size="9" fill="#9099a8">' + esc(L[ix]) + "</text>";
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="板块指数近30日走势与成交额">' + g + "</svg>";
  }

  /* ---------- TOP5 卡片 ---------- */
  var SORTS = [
    { k: "score", n: "综合排名" }, { k: "rev", n: "营收增速" },
    { k: "gain", n: "季度涨幅" }, { k: "heat", n: "热度" },
  ];
  var cur = "score";
  function numOf(v) { var n = parseFloat(String(v).replace(/[^\d.\-+]/g, "")); return isNaN(n) ? -999 : n; }
  function sorted() {
    var a = TOP.slice();
    if (cur === "score") a.sort(function (x, y) { return y.score - x.score; });
    else if (cur === "rev") a.sort(function (x, y) { return numOf(y.factors[0].value) - numOf(x.factors[0].value); });
    else if (cur === "gain") a.sort(function (x, y) { return numOf(y.factors[1].value) - numOf(x.factors[1].value); });
    else a.sort(function (x, y) { return numOf(y.factors[3].value) - numOf(x.factors[3].value); });
    return a;
  }
  function renderFilters() {
    $("filters").innerHTML = SORTS.map(function (f) {
      return '<button class="f-chip' + (cur === f.k ? " on" : "") + '" data-k="' + f.k + '">' + esc(f.n) + "</button>";
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".f-chip"), function (b) {
      b.addEventListener("click", function () { cur = b.getAttribute("data-k"); renderFilters(); renderTop(); });
    });
  }
  function renderTop() {
    $("top-list").innerHTML = sorted().map(function (x, i) {
      var v = x.valuation || {}, t = v.tone || "neutral";
      var pct = (v.percentile == null ? 50 : v.percentile);
      var cells = (x.factors || []).map(function (f) {
        return '<div class="rk-cell t-' + esc(f.tone) + '">' +
          '<div class="fn">' + esc(f.name) + '</div><div class="fv">' + esc(f.value) + "</div>" +
          '<div class="fnote">' + esc(f.note) + "</div></div>";
      }).join("");
      var svg = drawTrend(x.chart || {});
      return '<article class="card rk">' +
        '<div class="rk-top"><span class="rk-no">NO.' + (i + 1) + '</span>' +
        '<span class="rk-name">' + esc(x.name) + '</span>' +
        '<span class="rk-score">综合 ' + esc(x.score) + '</span></div>' +
        '<div class="rk-line">' + esc(x.oneLiner) + "</div>" +
        '<div class="rk-val"><span class="val-tag ' + t + '">' + esc(v.label || "—") + "</span>" +
        '<span class="vt">' + esc(v.text || "") + "</span></div>" +
        '<div class="val-bar ' + t + '"><i style="width:' + pct + '%"></i></div>' +
        '<div class="val-cap">' + esc(v.basis || "") + " · 绿＝估值便宜，不等于会涨</div>" +
        '<div class="rk-f">' + cells + "</div>" +
        (svg ? '<div class="rk-chart">' + svg + '<div class="rk-legend">' +
          '<span><i style="background:#2b4bd8"></i>板块指数</span>' +
          '<span><i style="background:#9aa7ba"></i>成交额（红涨绿跌）</span></div></div>' : "") +
        '<div class="rk-src">来源：东方财富（板块日K · 历史资金流 · 2026三季报 · 行业估值）；' +
        '成分股营收按板块汇总，估值为申万行业代表板块口径。</div>' +
        "</article>";
    }).join("");
  }
  renderFilters(); renderTop();

  /* ---------- 三段式 利好 / 爆雷 ---------- */
  function renderSignals(list, boxId, good) {
    var label2 = good ? "利好消息" : "爆雷消息";
    $(boxId).innerHTML = list.map(function (n) {
      return '<article class="card sgn ' + (good ? "sgn-good" : "sgn-bad") + '">' +
        '<div class="sgn-top"><span class="sgn-no">' + String(n.no).padStart(2, "0") + "</span>" +
        '<span class="sgn-theme">' + esc(n.theme) + "</span>" +
        '<span class="sgn-time">' + esc(n.time) + "</span>" +
        '<span class="sgn-imp">' + (good ? "利好" : "需留意") + "</span></div>" +
        '<div class="seg s-name"><span class="seg-k"><i></i>行业板块名称</span><p>' + esc(n.sector) + "</p></div>" +
        '<div class="seg s-msg"><span class="seg-k"><i></i>' + label2 + "</span><p>" + esc(n.news) + "</p></div>" +
        '<div class="seg s-opp"><span class="seg-k"><i></i>机会分析</span><p>' + esc(n.opportunity) + "</p></div>" +
        (n.risk ? '<div class="risk-note">' + esc(String(n.risk).replace(/^[^\u4e00-\u9fa5]+/, "")) + "</div>" : "") +
        '<div class="sgn-src">原文：' + esc(n.rawTitle) + "<br>来源：" + esc(n.source) +
        " · " + esc(n.time) + " · 板块关联为规则映射</div>" +
        "</article>";
    }).join("");
  }
  renderSignals(GOOD, "good-list", true);
  renderSignals(BAD, "bad-list", false);

  /* ---------- 数据来源与追溯 ---------- */
  $("channels").innerHTML = (D.channels || []).map(function (c) {
    return '<div class="ch ' + (c.status === "ok" ? "ok" : "partial") + '">' +
      '<i class="st"></i><span class="nm">' + esc(c.short) + "</span>" +
      '<span class="sm">' + (c.status === "ok" ? "可达" : "受限") + "</span></div>";
  }).join("");
  $("trace").innerHTML = (D.trace || []).map(function (t) {
    return '<div class="tr"><span class="tp">' + esc(t.provider) + "</span>" +
      '<span class="tn">' + esc(t.endpoint) + " · " + esc(t.note || "") + "</span></div>";
  }).join("");
})();
</script>
</body>
</html>
