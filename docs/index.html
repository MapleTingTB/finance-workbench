<meta name="mobile-web-app-capable" content="yes">

<title>理财工作台 · 财经新闻 / 行业板块 / 指数跟踪 / 债券基金</title>
<style>
  :root{
    --brand:#0a59f7; --brand2:#3784fc; --brand-soft:#eaf0ff;
    --bg:#f4f6f9; --card:#fff; --ink:#1d2430; --ink2:#586273; --ink3:#9099a8;
    --line:#eaeef3; --up:#d92b2b; --down:#128a4c; --risk:#c9740a;
    --risk-bg:#fff4e3; --risk-line:#f0be72;
    --shadow:0 1px 3px rgba(28,42,70,.05),0 6px 18px rgba(28,42,70,.04);
    --statusbar-h:30px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"HarmonyOS Sans SC","HarmonyOS Sans",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#e6eaf1;color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  h1,h2,h3,p{margin:0}

  /* 手机壳：桌面预览时居中，鸿蒙真机全屏 */
  #shell{
    max-width:480px;margin:0 auto;height:100vh;height:100dvh;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
    background:var(--bg);box-shadow:0 0 40px rgba(20,32,60,.10);
  }
  .view{display:flex;flex-direction:column;min-height:0;flex:1}
  #view-module[hidden]{display:none}
  #view-home[hidden]{display:none}

  /* ---------- 模拟状态栏（桌面预览用；standalone 时交给真机状态栏） ---------- */
  .statusbar{
    height:var(--statusbar-h);flex:0 0 var(--statusbar-h);
    background:var(--brand);color:#fff;display:flex;align-items:center;
    justify-content:space-between;padding:0 16px;font-size:11px;font-weight:700;
    letter-spacing:.3px;font-variant-numeric:tabular-nums;
  }
  .sb-r{display:flex;align-items:center;gap:6px}
  .sb-sig{display:flex;align-items:flex-end;gap:1.5px;height:10px}
  .sb-sig i{display:block;width:2.5px;background:#fff;border-radius:1px;opacity:.95}
  .sb-sig i:nth-child(1){height:4px}.sb-sig i:nth-child(2){height:6px}
  .sb-sig i:nth-child(3){height:8px}.sb-sig i:nth-child(4){height:10px}
  .sb-wifi{width:11px;height:8px;border:1.6px solid #fff;border-bottom:0;border-radius:9px 9px 0 0;position:relative}
  .sb-wifi::after{content:"";position:absolute;left:3.4px;bottom:-3px;width:2.4px;height:2.4px;background:#fff;border-radius:50%}
  .sb-bat{width:19px;height:9.5px;border:1.4px solid #fff;border-radius:2.5px;position:relative;padding:1.2px}
  .sb-bat::after{content:"";position:absolute;right:-3.5px;top:2.4px;width:2px;height:3.5px;background:#fff;border-radius:0 1px 1px 0}
  .sb-bat i{display:block;height:100%;width:72%;background:#fff;border-radius:1px}
  @media (display-mode:standalone),(display-mode:fullscreen){
    .statusbar{display:none}
    #shell{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  }

  /* ---------- 首页 ---------- */
  #view-home{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .hero{
    background:linear-gradient(135deg,#0a59f7 0%,#2b74f7 55%,#3784fc 100%);
    color:#fff;padding:20px 18px 26px;position:relative;overflow:hidden;flex:0 0 auto;
  }
  .hero::after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;
    background:rgba(255,255,255,.09)}
  .hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:170px;height:170px;border-radius:50%;
    background:rgba(255,255,255,.06)}
  .hero-row{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
  .hero-logo{width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center}
  .hero-logo svg{width:23px;height:23px}
  .hero-t h1{font-size:20px;font-weight:800;letter-spacing:.5px;line-height:1.25}
  .hero-t p{font-size:11px;opacity:.9;margin-top:3px;line-height:1.5}
  .hero-badge{margin-left:auto;flex:0 0 auto;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
    border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .hero-sub{margin-top:14px;font-size:11.5px;line-height:1.6;opacity:.93;position:relative;z-index:1;
    background:rgba(255,255,255,.13);border-radius:10px;padding:9px 11px}
  .hero-sub b{font-weight:800}
  .hero-meta{display:flex;gap:14px;margin-top:12px;font-size:10.5px;opacity:.86;position:relative;z-index:1;
    flex-wrap:wrap}
  .hero-meta span{display:flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block;opacity:.85}

  .home-body{padding:14px 14px 26px;display:flex;flex-direction:column;gap:14px}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .sec-h{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
  .sec-h .bar{width:3px;height:15px;border-radius:3px;background:var(--brand)}
  .sec-h h2{font-size:14px;font-weight:800;letter-spacing:.3px}
  .sec-h .hint{margin-left:auto;font-size:10.5px;color:var(--ink3)}

  /* 今日速览 */
  .quick-list{padding:0 12px 12px}
  .qi{display:flex;align-items:flex-start;gap:9px;padding:9px 8px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;transition:background .15s}
  .qi:active{background:#f6f8fc}
  .qi + .qi{border-top:1px solid #f1f3f7}
  .qi-l{flex:0 0 60px;font-size:11px;font-weight:800;color:var(--ink2);padding-top:1px}
  .qi-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
  .qi-t{flex:1;min-width:0;font-size:11.5px;line-height:1.6;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .qi-arrow{flex:0 0 auto;color:#c2c9d4;font-size:14px;line-height:1.4}

  /* 提醒横幅 */
  .banner{border-radius:14px;padding:12px 13px;display:flex;align-items:flex-start;gap:10px;
    border:1px solid #cfe6d8;background:#f0f9f3}
  .banner.warn{border-color:var(--risk-line);background:var(--risk-bg)}
  .banner-ic{width:26px;height:26px;flex:0 0 26px;border-radius:9px;background:rgba(18,138,76,.13);
    display:flex;align-items:center;justify-content:center;color:var(--down)}
  .banner.warn .banner-ic{background:rgba(201,116,10,.15);color:var(--risk)}
  .banner-ic svg{width:16px;height:16px}
  .banner-t{flex:1;min-width:0}
  .banner-t .bt{font-size:12px;font-weight:800;line-height:1.4}
  .banner-t .bd{font-size:10.5px;color:var(--ink2);line-height:1.6;margin-top:3px;word-break:break-word}
  .banner button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink2);
    border-radius:8px;padding:6px 9px;font-size:10.5px;font-weight:700;cursor:pointer}

  /* 四宫格功能卡 */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:0 12px 13px}
  .mc{border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 11px 10px;
    cursor:pointer;position:relative;overflow:hidden;min-width:0;transition:transform .14s,box-shadow .14s}
  .mc:active{transform:scale(.98);box-shadow:0 4px 14px rgba(28,42,70,.10)}
  .mc::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--ac)}
  .mc-top{display:flex;align-items:center;gap:8px;min-width:0}
  .mc-ic{width:30px;height:30px;flex:0 0 30px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;background:#f2f6ff;background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ac)}
  .mc-ic svg{width:18px;height:18px}
  .mc-n{font-size:13.5px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-arrow{margin-left:auto;flex:0 0 auto;color:#c2c9d4;font-size:15px}
  .mc-badge{display:inline-block;margin-top:9px;font-size:10px;font-weight:800;color:var(--ac);
    background:#f2f6ff;background:color-mix(in srgb,var(--ac) 10%,#fff);border-radius:6px;padding:3px 7px;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-sub{font-size:10px;color:var(--ink3);margin-top:7px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .mc-head{font-size:11.5px;font-weight:700;line-height:1.5;margin-top:8px;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:34px}
  .mc-desc{font-size:10px;color:var(--ink2);line-height:1.5;margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:30px}
  .mc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:10px;
    border-top:1px dashed var(--line);padding-top:8px}
  .ms{min-width:0;text-align:center}
  .ms .k{font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms .v{font-size:11px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-variant-numeric:tabular-nums;color:var(--ink)}
  .ms .v.up{color:var(--up)}.ms .v.down{color:var(--down)}
  .mc-foot{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:9.5px;color:var(--ink3)}
  .mc-foot .ld{width:5px;height:5px;border-radius:50%;background:#c7d0dc}
  .mc-foot .go{margin-left:auto;color:var(--ac);font-weight:800}

  /* 页脚 */
  .foot{padding:13px 14px;font-size:10.5px;color:var(--ink3);line-height:1.75;word-break:break-word}
  .foot b{color:var(--ink2)}
  .foot .ft-t{font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:6px}
  .foot .src{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .foot .disc{margin-top:8px;padding:9px 10px;background:#f7f9fc;border-radius:9px;color:#7b8492}
  .pwa-tip{display:flex;align-items:flex-start;gap:8px;margin-top:9px;padding:9px 10px;
    background:#f2f6ff;border:1px solid #dbe6ff;border-radius:9px;color:#3c5a91;font-size:10px;line-height:1.65}
  .pwa-tip svg{width:14px;height:14px;flex:0 0 14px;margin-top:1px}

  /* ---------- 模块视图 ---------- */
  .modbar{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:9px;padding:8px 10px 8px 8px;min-width:0}
  .back{flex:0 0 auto;border:0;background:var(--brand-soft);color:var(--brand);
    border-radius:9px;padding:8px 9px;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
  .chips{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;min-width:0;flex:1;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#f7f9fc;color:var(--ink2);
    border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
  .chip.on{color:#fff;border-color:transparent}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:block}
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;color:var(--ink3);font-size:11.5px;z-index:2;background:var(--bg)}
  .loading[hidden]{display:none}
  .spin{width:22px;height:22px;border:2.5px solid #dfe6f2;border-top-color:var(--brand);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

      <section class="sec foot" id="foot"></section>

  </main>

  <!-- ============ 模块视图 ============ -->
  <section id="view-module" class="view" hidden>
    <div class="modbar">
      <button class="back" id="btn-back" type="button">‹ 工作台</button>

    </div>
    <div id="stage">
      <div class="loading" id="loading"><span class="spin"></span><span>正在打开模块…</span></div>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";
  var D = {};
  try { D = JSON.parse(document.getElementById("workbench-data").textContent || "{}"); }
  catch (e) { D = {}; }

  // 四个模块页面以 base64(UTF-8) 内联在本文件里，iframe 用 srcdoc 装载。
  // 这样发布到在线环境时不再请求 pages/*.html 外部文件，彻底杜绝 NoSuchKey / 404。
  var BUNDLE = {};
  try { BUNDLE = JSON.parse(document.getElementById("page-bundle").textContent || "{}"); }
  catch (e) { BUNDLE = {}; }
  function decodePage(id) {
    var it = BUNDLE[id];
    if (!it || !it.html) return null;
    try {
      var bin = atob(it.html);
      if (typeof TextDecoder !== "undefined") {
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder("utf-8").decode(bytes);
      }
      return decodeURIComponent(escape(bin));
    } catch (e) { return null; }
  }
  function bundleMissingHtml(id, m) {
    return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>body{margin:0;padding:28px;font:14px/1.7 -apple-system,"PingFang SC",sans-serif;' +
      'color:#334155;background:#f7f8fa}h3{margin:0 0 10px;font-size:16px;color:#0f172a}' +
      'p{margin:8px 0}code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:12.5px}</style>' +
      '</head><body><h3>模块页面未内联</h3>' +
      '<p>「' + esc(m.name) + '」的页面数据没有随本文件一起发布。</p>' +
      '<p>请在本机执行 <code>python3 scripts/build_workbench.py</code> 重新生成单文件 ' +
      '<code>index.html</code> 后再发布；发布时<b>只需上传 index.html 这一个文件</b>。</p>' +
      '<p style="color:#94a3b8;font-size:12px">模块 id：' + esc(id) + '　·　内联装载模式</p>' +
      '</body></html>';
  }
  var MODS = D.modules || [];
  var META = D.meta || {};
  var OV = D.overview || {};
  var FOCUS = D.focus || [];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) {
    return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };
  // 数字与量词之间不折行，避免「70.7」和「分」被拆到两行
  var nb = function (s) {
    return String(s == null ? "" : s).replace(/(\d)\s+(分|%|条|只|点)/g, "$1\u00a0$2");
  };
  var toneColor = function (t) {
    return t === "up" ? "var(--up)" : (t === "down" ? "var(--down)" : "#8fa2c4");
  };
  var cur = null;                 // 当前模块 id，null = 首页
  var frames = {};                // id -> iframe（保留不销毁，维持编辑/弹窗状态）
  var loaded = {};                // id -> 是否已 load

  // 向鸿蒙 ArkWeb 原生壳上报路由（用于返回键：模块页先回工作台，首页再退出）
  function reportRoute() {
    try {
      if (window.harmonyBridge && typeof window.harmonyBridge.setAtHome === "function") {
        window.harmonyBridge.setAtHome(!cur);
      }
    } catch (e) {}
  }

  /* ---------- 几何图标（不使用 emoji） ---------- */
  function iconSvg(type) {
    var c = 'stroke="currentColor" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
    if (type === "news") return '<svg viewBox="0 0 24 24" ' + c + '><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9h7M7 13h10M7 17h10"/><rect x="15.5" y="8" width="2.5" height="2" rx=".6" fill="currentColor" stroke="none"/></svg>';
    if (type === "grid") return '<svg viewBox="0 0 24 24" ' + c + '><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>';
    if (type === "chart") return '<svg viewBox="0 0 24 24" ' + c + '><path d="M3 19h18M4 16l5-5 4 2 6-7"/><circle cx="19" cy="6" r="1.6" fill="currentColor" stroke="none"/><path d="M4 19v-3M9 19v-3M14 19v-3M19 19v-3" opacity=".45"/></svg>';
    return '<svg viewBox="0 0 24 24" ' + c + '><path d="M12 3l7.5 3v5.6c0 4.5-3.1 7.8-7.5 9.4-4.4-1.6-7.5-4.9-7.5-9.4V6L12 3z"/><path d="M8.6 12.2l2.3 2.3 4.5-4.6"/></svg>';
  }
  var checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.6c0 4.5-3.1 7.8-7.5 9.4-4.4-1.6-7.5-4.9-7.5-9.4V6L12 3z"/><path d="M8.6 12.2l2.3 2.3 4.5-4.6"/></svg>';
  var bellSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>';
  var infoSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';

  /* ---------- 首页渲染 ---------- */
  function renderHero() {
    $("hero-badge").textContent = (META.updateTime || "14:00") + " 更新";

      '<span><i class="dot"></i>' + esc(META.latestDate || "—") + ' 最新数据</span>',
      '<span><i class="dot"></i>' + esc((META.moduleCount || MODS.length)) + ' 个功能模块</span>',
      '<span><i class="dot"></i>离线可用</span>'
    ];
    $("hero-meta").innerHTML = bits.join("");
    var t = new Date();
    $("sb-time").textContent = ("0" + t.getHours()).slice(-2) + ":" + ("0" + t.getMinutes()).slice(-2);
  }

  function renderQuick() {
    if (!FOCUS.length) { $("quick-list").innerHTML = '<div class="qi"><div class="qi-t">暂无速览数据</div></div>'; return; }

  }

  function renderBanner() {
    var a = OV.alert || { triggered: 0, threshold: 0.7, detail: "尚未运行提醒脚本" };

    $("banner-wrap").innerHTML =
      '<div class="banner' + (warn ? " warn" : "") + '">' +
        '<div class="banner-ic">' + (warn ? bellSvg : checkSvg) + '</div>' +
        '<div class="banner-t"><div class="bt">' +
          (warn ? "买入跌幅提醒 · " + a.triggered + " 只触发" : "买入跌幅弹窗提醒 · 监控中") + '</div>' +
          '<div class="bd">' + esc(a.detail) +
          '（阈值 ' + (a.threshold != null ? a.threshold : 0.7) + '%）</div></div>' +
        '<button type="button" data-go="bond-funds">查看</button>' +
      '</div>';
  }

  function renderGrid() {
    $("grid-hint").textContent = MODS.length + " 个";
    var h = "";
    MODS.forEach(function (m) {
      var st = (m.stats || []).map(function (s) {
        return '<div class="ms"><div class="k">' + esc(s.k) + '</div>' +
               '<div class="v ' + (s.tone === "up" ? "up" : (s.tone === "down" ? "down" : "")) + '">' +
               esc(s.v) + '</div></div>';
      }).join("");
      h += '<article class="mc" data-go="' + esc(m.id) + '" style="--ac:' + esc(m.accent) + '">' +
             '<div class="mc-top"><div class="mc-ic">' + iconSvg(m.icon) + '</div>' +
               '<div class="mc-n">' + esc(m.name) + '</div><div class="mc-arrow">›</div></div>' +
             '<div class="mc-badge">' + esc(m.badge) + '</div>' +
             '<div class="mc-sub">' + esc(m.sub) + '</div>' +
             '<div class="mc-head">' + esc(nb(m.headline)) + '</div>' +
             '<div class="mc-desc">' + esc(m.desc) + '</div>' +
             '<div class="mc-stats">' + st + '</div>' +
             '<div class="mc-foot"><i class="ld"></i>' + esc(m.date) + ' 更新' +
               (m.weekday ? ' · ' + esc(m.weekday) : '') + '<span class="go">进入 ›</span></div>' +
           '</article>';
    });
    $("mod-grid").innerHTML = h;
  }

  function renderFoot() {
    var src = (META.sources || []).join(" · ");
    var h = '<div class="ft-t">关于本工作台</div>' +
      '<div><b>更新规则：</b>每天 ' + esc(META.updateTime || "14:00") +
      '（' + esc(META.timezone || "Asia/Shanghai") + '）按各模块定时任务独立更新，周末与法定节假日顺延至下一交易日。</div>' +
      '<div style="margin-top:5px"><b>数据日期：</b>' + esc(META.dateNote || "以各卡片标注为准") + '。' +
      esc(META.dataMode || "") + '；数据已随页面打包，断网也能查看。</div>' +
      '<div style="margin-top:5px"><b>本机适配：</b>四个模块页面保持自包含、零改动；' +
      '自选清单、买入记录与提醒设置保存在本机浏览器，模块间互不干扰。</div>' +
      '<div class="src"><b>数据来源：</b>' + esc(src) + '。所有数值逐条可回验。</div>' +
      '<div class="pwa-tip">' + infoSvg +
        '<span>鸿蒙 / HarmonyOS：用浏览器打开本页 →「添加到桌面」即可以独立窗口全屏运行、离线可用；' +
        '也可用 harmony/ 下的 ArkTS 原生工程，通过 ArkWeb 加载本地页面打包成 .hap。</span></div>' +
      '<div class="disc">' + esc(D.disclaimer || "") + '</div>';
    $("foot").innerHTML = h;
  }

  /* ---------- 模块切换 ---------- */
  function byId(id) {
    for (var i = 0; i < MODS.length; i++) if (MODS[i].id === id) return MODS[i];
    return null;
  }
  function renderChips(active) {
    $("chips").innerHTML = MODS.map(function (m) {
      var on = m.id === active;
      return '<button type="button" class="chip' + (on ? " on" : "") + '" data-go="' + esc(m.id) + '"' +
             (on ? ' style="background:' + esc(m.accent) + '"' : '') + '>' + esc(m.name) + '</button>';
    }).join("");
    // 让选中胶囊滚动到可见区
    var el = $("chips").querySelector(".chip.on");
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", inline: "center" });
  }

  function showLoading(show) { $("loading").hidden = !show; }

  function openModule(id, push) {
    var m = byId(id);
    if (!m) { goHome(false); return; }
    cur = id;
    reportRoute();
    $("view-home").hidden = true;
    $("view-module").hidden = false;
    renderChips(id);

    if (!frames[id]) {
      showLoading(true);
      var f = document.createElement("iframe");
      f.setAttribute("data-mod", id);
      f.setAttribute("name", "wb-" + id);
      f.setAttribute("title", m.name);
      f.setAttribute("allow", "notifications");
      var html = decodePage(id);
      f.srcdoc = html || bundleMissingHtml(id, m);
      f.addEventListener("load", function () { loaded[id] = true; if (cur === id) showLoading(false); });
      f.addEventListener("error", function () { if (cur === id) showLoading(false); });
      frames[id] = f;
      $("stage").appendChild(f);
    } else if (cur === id && !loaded[id]) {
      showLoading(true);
    }
    // 只显示当前 iframe，其余保留在 DOM 里以维持各自状态
    Object.keys(frames).forEach(function (k) {
      frames[k].style.display = (k === id) ? "block" : "none";
    });
    if (loaded[id]) showLoading(false);

    if (push !== false) {
      try { history.pushState({ m: id }, "", "#/m/" + id); } catch (e) {}
    }
  }

  function goHome(push) {
    cur = null;
    reportRoute();
    $("view-module").hidden = true;
    $("view-home").hidden = false;
    Object.keys(frames).forEach(function (k) { frames[k].style.display = "none"; });
    showLoading(false);
    if (push !== false) {
      try { history.pushState({ m: null }, "", location.pathname + location.search); } catch (e) {}
    }
    $("view-home").scrollTop = 0;
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go]");
    if (t) { openModule(t.getAttribute("data-go"), true); return; }
  });
  $("btn-back").addEventListener("click", function () { goHome(true); });

  window.addEventListener("popstate", function (e) {
    var id = (e.state && e.state.m) || null;
    if (!id) {
      var m = /^#\/m\/([\w-]+)$/.exec(location.hash || "");
      id = m ? m[1] : null;
    }
    if (id && byId(id)) openModule(id, false); else goHome(false);
  });

  // 供鸿蒙 ArkTS 侧 onBackPress 调用：返回 true 表示已由页面处理
  window.__workbenchBack = function () {
    if (cur) { goHome(true); return true; }
    return false;
  };

  /* ---------- 初始路由：支持 ?m=<id>、#/m/<id>、PWA shortcuts ---------- */
  function initialRoute() {
    var q = new URLSearchParams(location.search).get("m");
    var hm = /^#\/m\/([\w-]+)$/.exec(location.hash || "");
    var id = q || (hm ? hm[1] : null);
    if (id && byId(id)) {
      try { history.replaceState({ m: id }, "", "#/m/" + id); } catch (e) {}
      openModule(id, false);
    } else {
      goHome(false);
    }
  }

  /* ---------- Service Worker（仅安全上下文注册） ---------- */
  function registerSW() {
    if (!("serviceWorker" in navigator)) return;
    var ok = location.protocol === "https:" ||
             location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if (!ok) return;
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  renderHero(); renderQuick(); renderBanner(); renderGrid(); renderFoot();
  initialRoute(); registerSW();
})();
</script>
</body>
</html>
