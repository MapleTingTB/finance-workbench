name: 理财工作台 · 工作日 14:00 自动更新

# 时区说明：GitHub Actions 的 cron 一律按 UTC 解析。
# UTC 06:00 = 北京 14:00；1-5 = 周一至周五（无跨日问题）。
on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:            # 可在 Actions 页面手动「立即更新」

# 不监听 push：首次部署时 push 事件与手动触发会同时运行，两个任务各自
# 提交产物会互相造成 non-fast-forward。定时任务 + 手动触发已足够，
# 且提交步骤内置「对齐远程最新」保护，排队运行也不会冲突。
permissions:
  contents: write

concurrency:
  group: finance-workbench-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集 → 质量校验 → 构建 → 同步 docs/
        # 内置保护：某模块采集失败或数据降级时自动沿用上一版，绝不发布坏数据
        run: python3 finance-workbench/scripts/daily_update.py --deploy

      - name: 提交产物（供 Pages 托管）
        run: |
          git config user.name  "workbench-bot"
          git config user.email "workbench-bot@users.noreply.github.com"
          # 排队运行的 checkout SHA 可能已过期：先把 HEAD 对齐远程最新，
          # --mixed 只重置 HEAD 与索引，工作区里刚生成的产物完整保留。
          git fetch origin main
          git reset --mixed FETCH_HEAD
          git add docs/ \
            finance-news/index.html industry-sectors/index.html \
            index-tracking/index.html bond-funds/index.html
          if git diff --cached --quiet; then
            echo "本次无产物变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +'%Y-%m-%d')"
            git push origin HEAD:main
          fi
