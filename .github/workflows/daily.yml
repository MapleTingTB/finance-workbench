name: 理财工作台 · 工作日 13:30 更新 / 14:00 检测补跑

# 时区说明：GitHub Actions 的 cron 一律按 UTC 解析。
#   UTC 05:30 = 北京 13:30（主更新）
#   UTC 06:00 = 北京 14:00（检测补跑）
#   UTC 06:30 = 北京 14:30（检测补跑兜底，防 14:00 被 GitHub 跳过）
# 1-5 = 周一至周五。检测脚本内部再判一次工作日，双保险。
#
# 规则：
#   13:30 -> 无条件主更新（采集全部四个模块）
#   14:00 / 14:30 -> 检测四个模块数据日期是否为当天最新：
#       全是当天 -> 跳过（幂等，不重复采集）
#       任一非当天 -> 补跑一次更新
#   手动触发 -> 无条件更新
on:
  schedule:
    - cron: '30 5 * * 1-5'   # 北京 13:30 主更新
    - cron: '0 6 * * 1-5'    # 北京 14:00 检测补跑
    - cron: '30 6 * * 1-5'   # 北京 14:30 检测补跑兜底
  workflow_dispatch:            # 可在 Actions 页面手动「立即更新」

# 不监听 push：避免 push 与定时/手动触发并发提交造成 non-fast-forward。
# 提交步骤内置「对齐远程最新 HEAD」保护，排队运行也不会冲突。
permissions:
  contents: write

concurrency:
  group: finance-workbench-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 主更新（13:30 定时 / 手动触发）
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 5 * * 1-5'
        # 内置保护：某模块采集失败或数据降级时自动沿用上一版，绝不发布坏数据
        run: python3 finance-workbench/scripts/daily_update.py --deploy

      - name: 检测补跑（14:00 / 14:30）
        if: github.event_name == 'schedule' && github.event.schedule != '30 5 * * 1-5'
        run: |
          if python3 finance-workbench/scripts/check_freshness.py; then
            echo "数据已是当天最新或今日非工作日，跳过补跑。"
          else
            echo "检测到数据非当天最新，触发补跑更新。"
            python3 finance-workbench/scripts/daily_update.py --deploy
          fi

      - name: 提交产物（供 Pages 托管）
        run: |
          git config user.name  "workbench-bot"
          git config user.email "workbench-bot@users.noreply.github.com"
          # 排队运行的 checkout SHA 可能已过期：先把 HEAD 对齐远程最新，
          # --mixed 只重置 HEAD 与索引，工作区里刚生成的产物完整保留。
          git fetch origin main
          git reset --mixed FETCH_HEAD
          git add docs/ \
            finance-news/index.html industry-sectors/index.html \
            index-tracking/index.html bond-funds/index.html
          if git diff --cached --quiet; then
            echo "本次无产物变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +'%Y-%m-%d')"
            git push origin HEAD:main
          fi
